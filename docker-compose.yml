services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Laisser vide pour le mode extractif (sans LLM)
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DOCQA_CORPUS: /app/data/sample
    volumes:
      - ./data:/app/data:ro
